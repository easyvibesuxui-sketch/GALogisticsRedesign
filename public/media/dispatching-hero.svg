<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="img" aria-label="dispatch office monitors logistics">
  <defs>
    <linearGradient id="bgdispatchinghero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15181d"/>
      <stop offset="0.55" stop-color="#0d1014"/>
      <stop offset="1" stop-color="#07080a"/>
    </linearGradient>
    <radialGradient id="glowdispatchinghero" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#49ef45" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#49ef45" stop-opacity="0"/>
    </radialGradient>
    <pattern id="griddispatchinghero" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="stripedispatchinghero" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="17" height="34" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1600" height="1200" fill="url(#bgdispatchinghero)"/>
  <rect width="1600" height="1200" fill="url(#griddispatchinghero)"/>
  <rect width="1600" height="1200" fill="url(#glowdispatchinghero)"/>

  <!-- hazard band, a nod to the trade -->
  <rect x="0" y="1068" width="1600" height="16" fill="url(#stripedispatchinghero)"/>

  <!-- centred so a cover-crop to 21:9 or 3:4 still shows the subject -->
  <g transform="translate(560, 410) scale(2)">
    <g fill="none" stroke="#49ef45" stroke-opacity="0.5"
       stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      
    <rect x="46" y="34" width="148" height="82" rx="6" />
    <path d="M46 96h148" />
    <path d="M96 116v18h48v-18" />
    <path d="M72 140h96" />
    <path d="M74 62h44M74 76h68" />
    </g>
  </g>

  <g transform="translate(800, 810)" text-anchor="middle"
     font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text y="0" fill="#ffffff" fill-opacity="0.62" font-size="30" letter-spacing="7">DISPATCHING-HERO</text>
    <text y="42" fill="#ffffff" fill-opacity="0.30" font-size="22" letter-spacing="2">dispatch office monitors logistics</text>
  </g>
</svg>
