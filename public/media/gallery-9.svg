<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="img" aria-label="fleet of trucks lined up">
  <defs>
    <linearGradient id="bggallery9" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15181d"/>
      <stop offset="0.55" stop-color="#0d1014"/>
      <stop offset="1" stop-color="#07080a"/>
    </linearGradient>
    <radialGradient id="glowgallery9" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#49ef45" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#49ef45" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridgallery9" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="stripegallery9" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="17" height="34" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1600" height="1200" fill="url(#bggallery9)"/>
  <rect width="1600" height="1200" fill="url(#gridgallery9)"/>
  <rect width="1600" height="1200" fill="url(#glowgallery9)"/>

  <!-- hazard band, a nod to the trade -->
  <rect x="0" y="1068" width="1600" height="16" fill="url(#stripegallery9)"/>

  <!-- centred so a cover-crop to 21:9 or 3:4 still shows the subject -->
  <g transform="translate(560, 410) scale(2)">
    <g fill="none" stroke="#49ef45" stroke-opacity="0.5"
       stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      
    <path d="M12 104h34l14-46h62l14 46h34" />
    <path d="M46 104h148" />
    <rect x="60" y="34" width="90" height="24" rx="4" />
    <circle cx="76" cy="120" r="14" />
    <circle cx="172" cy="120" r="14" />
    <path d="M150 58h22l18 30h-40z" />
    </g>
  </g>

  <g transform="translate(800, 810)" text-anchor="middle"
     font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text y="0" fill="#ffffff" fill-opacity="0.62" font-size="30" letter-spacing="7">GALLERY-9</text>
    <text y="42" fill="#ffffff" fill-opacity="0.30" font-size="22" letter-spacing="2">fleet of trucks lined up</text>
  </g>
</svg>
