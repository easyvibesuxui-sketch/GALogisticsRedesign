<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="img" aria-label="dry van trailer">
  <defs>
    <linearGradient id="bgtrailerhero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15181d"/>
      <stop offset="0.55" stop-color="#0d1014"/>
      <stop offset="1" stop-color="#07080a"/>
    </linearGradient>
    <radialGradient id="glowtrailerhero" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#f0552b" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f0552b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridtrailerhero" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="stripetrailerhero" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="17" height="34" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1600" height="1200" fill="url(#bgtrailerhero)"/>
  <rect width="1600" height="1200" fill="url(#gridtrailerhero)"/>
  <rect width="1600" height="1200" fill="url(#glowtrailerhero)"/>

  <!-- hazard band, a nod to the trade -->
  <rect x="0" y="1068" width="1600" height="16" fill="url(#stripetrailerhero)"/>

  <!-- centred so a cover-crop to 21:9 or 3:4 still shows the subject -->
  <g transform="translate(560, 410) scale(2)">
    <g fill="none" stroke="#f0552b" stroke-opacity="0.5"
       stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      
    <rect x="24" y="44" width="164" height="60" rx="6" />
    <path d="M24 74h164" />
    <path d="M188 104h28" />
    <circle cx="72" cy="120" r="14" />
    <circle cx="112" cy="120" r="14" />
    <path d="M24 104h-12" />
    </g>
  </g>

  <g transform="translate(800, 810)" text-anchor="middle"
     font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text y="0" fill="#ffffff" fill-opacity="0.62" font-size="30" letter-spacing="7">TRAILER-HERO</text>
    <text y="42" fill="#ffffff" fill-opacity="0.30" font-size="22" letter-spacing="2">dry van trailer</text>
  </g>
</svg>
