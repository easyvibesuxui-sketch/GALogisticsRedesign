<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="img" aria-label="container truck drayage">
  <defs>
    <linearGradient id="bgport2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15181d"/>
      <stop offset="0.55" stop-color="#0d1014"/>
      <stop offset="1" stop-color="#07080a"/>
    </linearGradient>
    <radialGradient id="glowport2" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#49ef45" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#49ef45" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridport2" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="stripeport2" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="17" height="34" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1600" height="1200" fill="url(#bgport2)"/>
  <rect width="1600" height="1200" fill="url(#gridport2)"/>
  <rect width="1600" height="1200" fill="url(#glowport2)"/>

  <!-- hazard band, a nod to the trade -->
  <rect x="0" y="1068" width="1600" height="16" fill="url(#stripeport2)"/>

  <!-- centred so a cover-crop to 21:9 or 3:4 still shows the subject -->
  <g transform="translate(560, 410) scale(2)">
    <g fill="none" stroke="#49ef45" stroke-opacity="0.5"
       stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      
    <rect x="26" y="70" width="86" height="46" rx="4" />
    <rect x="128" y="70" width="86" height="46" rx="4" />
    <rect x="77" y="20" width="86" height="46" rx="4" />
    <path d="M44 70v46M62 70v46M94 70v46" />
    <path d="M146 70v46M164 70v46M196 70v46" />
    <path d="M95 20v46M113 20v46M145 20v46" />
    </g>
  </g>

  <g transform="translate(800, 810)" text-anchor="middle"
     font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text y="0" fill="#ffffff" fill-opacity="0.62" font-size="30" letter-spacing="7">PORT-2</text>
    <text y="42" fill="#ffffff" fill-opacity="0.30" font-size="22" letter-spacing="2">container truck drayage</text>
  </g>
</svg>
