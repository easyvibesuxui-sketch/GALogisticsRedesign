<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="img" aria-label="mechanic working under truck">
  <defs>
    <linearGradient id="bggallery8" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15181d"/>
      <stop offset="0.55" stop-color="#0d1014"/>
      <stop offset="1" stop-color="#07080a"/>
    </linearGradient>
    <radialGradient id="glowgallery8" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#f0552b" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f0552b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridgallery8" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="stripegallery8" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="17" height="34" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1600" height="1200" fill="url(#bggallery8)"/>
  <rect width="1600" height="1200" fill="url(#gridgallery8)"/>
  <rect width="1600" height="1200" fill="url(#glowgallery8)"/>

  <!-- hazard band, a nod to the trade -->
  <rect x="0" y="1068" width="1600" height="16" fill="url(#stripegallery8)"/>

  <!-- centred so a cover-crop to 21:9 or 3:4 still shows the subject -->
  <g transform="translate(560, 410) scale(2)">
    <g fill="none" stroke="#f0552b" stroke-opacity="0.5"
       stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      
    <path d="M158 34a34 34 0 0 0-46 44L44 146l14 14 68-68a34 34 0 0 0 44-46l-24 24-20-20z" />
    <circle cx="62" cy="142" r="6" />
    </g>
  </g>

  <g transform="translate(800, 810)" text-anchor="middle"
     font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text y="0" fill="#ffffff" fill-opacity="0.62" font-size="30" letter-spacing="7">GALLERY-8</text>
    <text y="42" fill="#ffffff" fill-opacity="0.30" font-size="22" letter-spacing="2">mechanic working under truck</text>
  </g>
</svg>
