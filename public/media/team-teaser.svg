<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="img" aria-label="logistics dispatcher office desk">
  <defs>
    <linearGradient id="bgteamteaser" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15181d"/>
      <stop offset="0.55" stop-color="#0d1014"/>
      <stop offset="1" stop-color="#07080a"/>
    </linearGradient>
    <radialGradient id="glowteamteaser" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#49ef45" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#49ef45" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridteamteaser" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <pattern id="stripeteamteaser" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="17" height="34" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1600" height="1200" fill="url(#bgteamteaser)"/>
  <rect width="1600" height="1200" fill="url(#gridteamteaser)"/>
  <rect width="1600" height="1200" fill="url(#glowteamteaser)"/>

  <!-- hazard band, a nod to the trade -->
  <rect x="0" y="1068" width="1600" height="16" fill="url(#stripeteamteaser)"/>

  <!-- centred so a cover-crop to 21:9 or 3:4 still shows the subject -->
  <g transform="translate(560, 410) scale(2)">
    <g fill="none" stroke="#49ef45" stroke-opacity="0.5"
       stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      
    <circle cx="120" cy="60" r="30" />
    <path d="M56 140a64 64 0 0 1 128 0" />
    </g>
  </g>

  <g transform="translate(800, 810)" text-anchor="middle"
     font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text y="0" fill="#ffffff" fill-opacity="0.62" font-size="30" letter-spacing="7">TEAM-TEASER</text>
    <text y="42" fill="#ffffff" fill-opacity="0.30" font-size="22" letter-spacing="2">logistics dispatcher office desk</text>
  </g>
</svg>
