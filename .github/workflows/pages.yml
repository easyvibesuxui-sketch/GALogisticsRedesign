# Builds the site and publishes it to GitHub Pages.
#
# Pages serves this repository from /GALogisticsRedesign/, so the build is
# followed by a pass that moves the site's root-absolute links under that
# path. Nothing in src/ knows about Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/website-redesign-scroll-effects-uhw89w]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      # Pages serves a project repository from /<repo>/. Taken from the repo
      # name rather than from actions/configure-pages: that action wants to
      # create the Pages site, which the workflow token is not allowed to do,
      # and it failed the whole job over a value we already know.
      - run: node scripts/rebase.mjs "/${{ github.event.repository.name }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
